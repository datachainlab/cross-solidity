name: Gas Snapshot & Report

on:
  pull_request:
    paths:
      - 'src/**'
      - 'foundry.toml'

permissions:
  contents: write
  pull-requests: write

jobs:
  gas-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'

      - name: Install dependencies
        run: npm ci

      - name: Run Snapshot Diff
        id: run_diff
        run: |
          npm run snapshot:diff | sed 's/\x1b\[[0-9;]*m//g' | grep -v "^>" > gas_diff.txt
          cat gas_diff.txt

      - name: Update Snapshot File
        run: npm run snapshot

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(gas): update .gas-snapshot [skip ci]"
          file_pattern: .gas-snapshot
          branch: ${{ github.head_ref }}

      - name: Comment Gas Diff on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const diffOutput = fs.readFileSync('gas_diff.txt', 'utf8');

            if (diffOutput.trim() === '') {
              console.log("No gas changes detected.");
              return;
            }

            const body = `### ⛽ Gas Snapshot Diff
            
            <details>
            <summary>Click to view gas changes</summary>
            
            \`\`\`diff
            ${diffOutput}
            \`\`\`
            
            </details>
            
            *Auto-generated by Foundry Gas Snapshot Action*`;

            const { owner, repo, number } = context.issue;
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const botComment = comments.data.find(c => c.body.includes('### ⛽ Gas Snapshot Diff'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: body
              });
            }
